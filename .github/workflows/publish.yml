name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.fingerprint.outputs.key }}
      deploy: ${{ github.event_name != 'schedule' || steps.lookup.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: make setup

      - uses: actions/create-github-app-token@v1
        id: brand-token
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          owner: aliAljaffer
          repositories: branding

      - id: fingerprint
        run: |
          brand=$(gh api repos/aliAljaffer/branding/commits/main --jq .sha)
          echo "key=deployed-$(.venv/bin/python fingerprint.py)-brand-${brand:0:12}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.brand-token.outputs.token }}

      - id: lookup
        uses: actions/cache/restore@v4
        with:
          path: .deployed
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true

  publish:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/create-github-app-token@v1
        id: brand-token
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          owner: aliAljaffer
          repositories: branding

      - name: Pull the theme from branding main
        run: make brand
        env:
          GH_TOKEN: ${{ steps.brand-token.outputs.token }}

      - run: make setup check build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=run-${{ github.run_id }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - uses: actions/checkout@v4
        with:
          repository: aliAljaffer/homelab
          token: ${{ steps.app.outputs.token }}
          path: homelab

      - name: Bump image tag in homelab
        working-directory: homelab
        run: |
          tag="run-${GITHUB_RUN_ID}"
          sed -i "s|newTag: .*|newTag: ${tag}|" kubernetes/apps/docs/kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "update-manifests-homelab[bot]"
          git config user.email "349350479+update-manifests-homelab[bot]@users.noreply.github.com"
          git commit -am "Deploy docs ${tag}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report the build size
        run: |
          echo "files: $(find site -type f | wc -l)  size: $(du -sh site | cut -f1)"
          find site -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -8

      - name: Install rclone
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Sync images to R2 and trim the Worker bundle
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ]; then
            echo "::warning::R2 credentials missing; leaving images in the Worker bundle."
            exit 0
          fi
          rclone copy site r2:docs-assets \
            --include "*.jpg" --include "*.jpeg" --include "*.png" --include "*.webp" \
            --checksum --transfers 16 --checkers 16 --s3-no-check-bucket
          find site -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" \) -delete

      - name: Add Cloudflare headers and redirects
        run: cp deploy/cloudflare/_headers deploy/cloudflare/_redirects site/

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # The zone stopped caching HTML (cache_level basic, browser TTL respecting
      # origin). This purge clears anything cached under the old policy. Both
      # hostnames are listed so the step keeps working after the cutover.
      - name: Purge the edge cache
        continue-on-error: true
        run: |
          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://docs-cf.alialjaffer.com/","https://docs.alialjaffer.com/"]}'

      - run: touch .deployed

      - uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .deployed
          key: ${{ needs.changes.outputs.key }}
