name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: make setup check build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
            type=raw,value=run-${{ github.run_id }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          owner: aliAljaffer
          repositories: homelab

      - uses: actions/checkout@v4
        with:
          repository: aliAljaffer/homelab
          token: ${{ steps.app.outputs.token }}
          path: homelab

      - name: Bump image tag in homelab
        working-directory: homelab
        run: |
          tag="run-${GITHUB_RUN_ID}"
          sed -i "s|newTag: .*|newTag: ${tag}|" kubernetes/apps/docs/kustomization.yaml
          git diff --quiet && exit 0
          git config user.name "docs-system CI"
          git config user.email "ci@users.noreply.github.com"
          git commit -am "Deploy docs ${tag}"
          git pull --rebase origin main
          git push origin HEAD:main
