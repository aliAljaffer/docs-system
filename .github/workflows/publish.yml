name: Publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PORTFOLIO_DIR: ${{ runner.temp }}/portfolio/src/data
  PORTFOLIO_PUBLIC_DIR: ${{ runner.temp }}/portfolio/public

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check out the portfolio
        run: git clone --depth 1 https://github.com/aliAljaffer/aliAljaffer.github.io.git "$RUNNER_TEMP/portfolio"

      - run: python sync.py --portfolio

      - run: python check_entries.py

      - run: python build.py

      - run: python check_parity.py

      - run: python -m unittest discover -s tests -v

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
