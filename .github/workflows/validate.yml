name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/create-github-app-token@v3
        id: brand-token
        with:
          app-id: 5511128
          private-key: ${{ secrets.HOMELAB_APP_KEY }}
          owner: aliAljaffer
          repositories: branding

      - name: Pull the theme from branding main
        run: make brand
        env:
          GH_TOKEN: ${{ steps.brand-token.outputs.token }}

      - run: make setup check build
        env:
          GITHUB_TOKEN: ${{ github.token }}
