site_name: Atlas
site_url: https://docs.alialjaffer.com/
docs_dir: site-src
site_dir: out-zensical-ar
theme:
  name: material
  language: ar
  palette:
    - scheme: default
      media: "(prefers-color-scheme: light)"
      toggle: {icon: material/weather-night, name: Night}
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      toggle: {icon: material/weather-sunny, name: Day}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.suggest
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - tables
  - toc:
      permalink: true
plugins:
  - search
  - tags

# Custom wiki layer: hover previews and backlinks
extra_css:
  - assets/hover.css
extra_javascript:
  - assets/hover.js

nav:
  - Home: index.md
  - Four Hats:
      - Overview: four-hats/index.md
      - "SWE-04: Add a feature with a test": four-hats/ep04.md
  - Cloud: cloud/index.md
  - Wiki:
      - Overview: wiki/index.md
      - REST: wiki/rest.md
      - Status code: wiki/status-code.md
  - Notes:
      - Docker: notes/docker.md
      - Obsidian: notes/obsidian.md
  - Tools: tools/index.md
