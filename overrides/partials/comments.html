{% if (page.url[:6] == 'blogs/' or page.url[:9] == 'projects/') and page.meta.comments is not sameas false %}
<h2 id="__comments">Comments</h2>
<script src="https://giscus.app/client.js"
  data-repo="aliAljaffer/aliAljaffer.github.io" data-repo-id="R_kgDOIZBWHA"
  data-category="Announcements" data-category-id="DIC_kwDOIZBWHM4DBcZ5"
  data-mapping="pathname" data-strict="0" data-reactions-enabled="1"
  data-input-position="top" data-loading="lazy"
  data-lang="{{ config.theme.language }}" data-theme="preferred_color_scheme"
  crossorigin="anonymous" async></script>
<script>
  const theme = () => document.body.getAttribute("data-md-color-scheme") === "slate" ? "dark" : "light";
  const sync = () => document.querySelector("iframe.giscus-frame")?.contentWindow
    ?.postMessage({ giscus: { setConfig: { theme: theme() } } }, "https://giscus.app");
  new MutationObserver(sync).observe(document.body, { attributeFilter: ["data-md-color-scheme"] });
  addEventListener("message", e => e.origin === "https://giscus.app" && sync(), { once: true });
</script>
{% endif %}
