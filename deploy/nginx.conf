server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;

    error_page 404 /404.html;

    location = /courses/four-hats {
        return 301 /four-hats/;
    }

    location /courses/four-hats/ {
        rewrite ^/courses/four-hats/(.*)$ /four-hats/$1 permanent;
    }

    location ~ ^/definitions/cloud/(multi-factor-authentication|totp|principle-of-least-privilege|traffic-analysis)/?$ {
        return 301 /definitions/security/$1/;
    }

    location ~ ^/definitions/cloud/(cidr)/?$ {
        return 301 /definitions/networking/$1/;
    }

    location ~ ^/definitions/cloud/(generative-ai|traditional-ai)/?$ {
        return 301 /definitions/ai/$1/;
    }

    location ~ ^/definitions/cloud/(application-integration|cloud-adoption-framework|consolidated-billing|partner-network|tenets-of-aws|tagging|migration-strategies|governance-and-compliance|operational-excellence-pillars|security-pillars|reliability-pillars|performance-efficiency-pillar|cost-optimization-pillar|total-cost-of-ownership|availability-zones|region|edge-location)/?$ {
        return 301 /definitions/aws/$1/;
    }

    location = /wiki {
        return 301 /definitions/;
    }

    location /wiki/ {
        rewrite ^/wiki/(.*)$ /definitions/$1 permanent;
    }

    location = /setup {
        return 301 /four-hats/setup/;
    }

    location /setup/ {
        rewrite ^/setup/(.*)$ /four-hats/setup/$1 permanent;
    }

    location = /cleanup-guide {
        return 301 /four-hats/cleanup-guide/;
    }

    location /cleanup-guide/ {
        rewrite ^/cleanup-guide/(.*)$ /four-hats/cleanup-guide/$1 permanent;
    }

    location = /costs-and-free-options {
        return 301 /four-hats/costs-and-free-options/;
    }

    location /costs-and-free-options/ {
        rewrite ^/costs-and-free-options/(.*)$ /four-hats/costs-and-free-options/$1 permanent;
    }

    location = /tools {
        return 301 /projects/;
    }

    location /tools/ {
        return 301 /projects/;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /assets/brand/fonts/ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "https://giscus.app";
    }

    location ~ ^/assets/giscus-(light|dark)\.css$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "https://giscus.app";
    }

    location = /assets/backlinks.json {
        expires -1;
        add_header Cache-Control "no-cache";
    }

    location ~ ^/(ar|blogs|notes|graph|tags|slides)(/|$) {
        return 301 /;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
